<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Globo de movilizaciones juveniles</title>
<style>
:root{--bg:#f4f1ea;--fg:#1d2430;--mut:#5d6675;--card:#fff;--line:#d9d4c7;--sea:#cfe0ea;--land:#a9bda3;--grat:rgba(30,50,70,.12);--acc:#d9482b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1419;--fg:#e8ecf1;--mut:#9aa6b5;--card:#171e26;--line:#2a3441;--sea:#13222e;--land:#2f4a3d;--grat:rgba(180,210,240,.10);--acc:#ff6b4a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1419;--fg:#e8ecf1;--mut:#9aa6b5;--card:#171e26;--line:#2a3441;--sea:#13222e;--land:#2f4a3d;--grat:rgba(180,210,240,.10);--acc:#ff6b4a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:24px 24px 0;max-width:1500px;margin:auto}
h1{margin:0;font-size:2.1rem;letter-spacing:-.01em}
header p{margin:6px 0 0;color:var(--mut);font-size:1.2rem}
.app{display:grid;grid-template-columns:minmax(0,1fr) minmax(460px,520px);gap:28px;max-width:1500px;margin:auto;padding:20px 24px 32px}
.stage{display:flex;justify-content:center;align-items:center}
canvas{width:100%;max-width:760px;aspect-ratio:1;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.side{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:16px;align-self:start}
.side h2{margin:0;font-size:2rem;line-height:1.2}
.yr{color:var(--mut);font-weight:400;font-size:1.3rem}
.tag{display:inline-block;background:var(--acc);color:#fff;border-radius:99px;padding:5px 16px;font-size:1.05rem;font-weight:600}
.side p{margin:0;font-size:1.3rem;line-height:1.55}
.side .src{color:var(--mut);font-size:1.05rem}
.chips{display:flex;flex-wrap:wrap;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.chips button{font:inherit;font-size:1.1rem;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:99px;padding:10px 18px;cursor:pointer}
.chips button:hover,.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.ban{width:100%;height:auto;border-radius:10px;display:block}
img.ban{aspect-ratio:16/9;object-fit:cover}
.lks{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.lks p{margin:0}
.lk{display:block;padding:14px 16px;border:1px solid var(--line);border-radius:12px;color:var(--acc);text-decoration:none;font-size:1.15rem;font-weight:600;word-break:break-word}
.lk:hover{background:var(--acc);border-color:var(--acc);color:#fff}
.back{font:inherit;font-size:1.2rem;font-weight:600;border:0;background:none;color:var(--acc);cursor:pointer;padding:8px 0 14px;text-align:left}
@media (max-width:900px){.app{grid-template-columns:1fr}}
</style>
</head>

["México","2026",23,-102,"Marcha sin enfrentamientos violentos","El 15 de noviembre de 2026, jóvenes de la Generación Z marcharon en Ciudad de México por la seguridad, la atención a la violencia y contra disposiciones que consideran restrictivas de la libertad de expresión. Se declararon independientes de los partidos. Se sumaron el Movimiento del Sombrero, que exige justicia por el asesinato de Carlos Manzo, y familiares de personas desaparecidas.","Sopitas (15 nov 2026)"],
["Italia","2026",42.5,12.5,"Huelga general anunciada","Hubo movilizaciones en Milán, Turín, Bolonia y Roma contra el aumento del costo de vida y los bajos salarios, y a favor de más servicios públicos, impuestos más justos y menos gasto militar. Se anunció una huelga general para el 20 de noviembre. No fueron protestas exclusivamente juveniles.","Swissinfo (17 oct 2026)"],

["Bangladesh","2025",23.7,90.4,"Hasina condenada (nov 2025)","Las protestas estudiantiles de 2024 derribaron el gobierno de Sheikh Hasina y dieron paso a una administración provisional de Muhammad Yunus. En 2025 siguieron los arrestos arbitrarios y las restricciones a las libertades. En noviembre de 2025 Hasina fue condenada por crímenes de lesa humanidad.","Amnistía Internacional"],

["Madagascar","2025",-19,46.9,"Salida del presidente Rajoelina","Las protestas juveniles empezaron por los cortes de agua y electricidad y pasaron a exigir el fin de la corrupción y la desigualdad. Con la intervención de sectores militares, el presidente Andry Rajoelina salió del poder.","Deschamps et al. (2025)"],
["Perú","2025",-9.2,-75,"Destitución de Dina Boluarte","Jóvenes rechazaron una reforma de pensiones y denunciaron corrupción e inseguridad. Estudiantes, trabajadores jóvenes y otros sectores marcharon, con denuncias de violencia policial y detenciones. El proceso impulsó la destitución de la presidenta Dina Boluarte.","CNN Español (2025); El País (2025)"],
["Bulgaria","2025",42.7,25.5,"Renuncia del primer ministro (11 dic)","La Generación Z rechazó el presupuesto 2026, que subía impuestos y contribuciones. El Gobierno retiró la propuesta, pero las protestas siguieron por corrupción, impunidad y falta de transparencia. El 11 de diciembre renunció el primer ministro Rosen Zhelyazkov.","Ivanov (2025), DW"],

["Bélgica","2025",50.6,4.6,"Protesta contra recortes a la educación","El 21 de octubre de 2025, estudiantes colocaron mil sillas vacías frente al Gobierno regional en Bruselas. Cada una representaba a unos veinte estudiantes que podían perder sus ayudas por los recortes de Flandes a la educación superior.","VUB (2025)"],

["Grecia","2026",39,22,"Unas 20 000 personas (cifra policial)","El 21 de octubre de 2026, estudiantes y docentes protestaron en varias ciudades por la falta de personal docente, el deterioro de las escuelas y el difícil acceso a vivienda. Se inspiraron en las movilizaciones juveniles de otros países europeos.","Le Monde (22 oct 2026)"],

["Mauricio","2026",-20.3,57.6,"Toques de queda","En octubre de 2026 hubo protestas por la escasez de agua y el costo de vida. Una mujer de 27 años fue herida por un disparo de un policía, lo que avivó el descontento. Hubo bloqueos, incendios, detenciones y toques de queda.","EU SEE (2026)"],
["Indonesia","2025–2026",-2,114,"Retiro de beneficios parlamentarios","En agosto de 2025, estudiantes protestaron contra los beneficios económicos de los parlamentarios y sumaron denuncias de corrupción y costo de vida. El Gobierno retiró algunos beneficios y cambió parte del gabinete. En 2026 siguieron protestas por motivos ambientales y económicos.","DW (2025); Democracy Now (2026)"],
["Kenia","2026",0.2,37.9,"Aniversario de las protestas de 2024","En junio de 2026, jóvenes volvieron a las calles al cumplirse dos años de las protestas contra la reforma tributaria. Exigieron justicia por los fallecidos, el fin de la brutalidad policial y respuestas a la corrupción.","Wasike (2026), DW"],
["Serbia","2025",44,21,"Renuncia del primer ministro","Tras el derrumbe en la estación de Novi Sad (nov 2024), que dejó 16 muertos, los estudiantes exigieron transparencia y responsabilidades. Se sumaron agricultores, actores y jueces. El primer ministro renunció, pero las protestas continuaron.","Kirby (2026), BBC Mundo"],
["Marruecos","2025",31.8,-6.5,"Compromisos de inversión en salud y educación","El movimiento Gen Z 212 denunció las fallas en salud y educación, el desempleo juvenil y la corrupción, y cuestionó el gasto en grandes proyectos deportivos. Hubo enfrentamientos y el Gobierno anunció inversiones en salud y educación.","CIDOB"]

const rad=Math.PI/180;

function P(lo,la){const l=(lo-L0)*rad,p=la*rad,f=F0*rad;
 return [Math.cos(p)*Math.sin(l),Math.cos(f)*Math.sin(p)-Math.sin(f)*Math.cos(p)*Math.cos(l),Math.sin(f)*Math.sin(p)+Math.cos(f)*Math.cos(p)*Math.cos(l)]}

// Polígonos GeoJSON; si el anillo cubre más de media esfera se invierte su orientación
const chaikin=(p,n)=>{for(;n--;){const o=[];for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];o.push([.75*a[0]+.25*b[0],.75*a[1]+.25*b[1]],[.25*a[0]+.75*b[0],.25*a[1]+.75*b[1]])}p=o}return p};
const GEO=LAND.map(p=>{const sm=chaikin(p,0),r=sm.concat([sm[0]]);if(d3.geoArea({type:'Polygon',coordinates:[r]})>2*Math.PI)r.reverse();return {type:'Polygon',coordinates:[r]}});

{const g=TEX.getContext('2d');for(let i=0;i<300;i++){g.fillStyle=Math.random()<.5?'rgba(255,255,255,.08)':'rgba(0,0,0,.12)';g.fillRect(Math.random()*96,Math.random()*96,1+Math.random()*2.5,1+Math.random()*2.5)}}

 const R=W*0.46,cx=W/2;ctx.clearRect(0,0,W,W);
 const halo=ctx.createRadialGradient(cx,cx,R*.97,cx,cx,R*1.1);halo.addColorStop(0,'rgba(100,170,240,.4)');halo.addColorStop(1,'rgba(100,170,240,0)');
 ctx.fillStyle=halo;ctx.beginPath();ctx.arc(cx,cx,R*1.1,0,7);ctx.fill();
 ctx.fillStyle=css('--sea');ctx.beginPath();ctx.arc(cx,cx,R,0,7);ctx.fill();
 PR.rotate([-L0,-F0]).translate([cx,cx]).scale(R);
 ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1;ctx.lineJoin='round';
 GEO.forEach(g=>{ctx.fillStyle=css('--land');ctx.beginPath();PATH(g);ctx.fill();ctx.fillStyle=TP;ctx.fill();ctx.stroke()});
 const sh=ctx.createRadialGradient(cx-R*.35,cx-R*.4,R*.15,cx,cx,R);sh.addColorStop(0,'rgba(255,255,255,.16)');sh.addColorStop(.55,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,10,30,.5)');
 ctx.fillStyle=sh;ctx.beginPath();ctx.arc(cx,cx,R,0,7);ctx.fill();
 hits=[];const acc=css('--acc');
 D.forEach((d,i)=>{const [x,y,c]=P(d[3],d[2]);if(c<0.08||(sel>=0&&i!==sel))return;const px=cx+x*R,py=cx-y*R;hits.push([i,px,py]);
  const s=i===sel;ctx.fillStyle=acc;ctx.globalAlpha=.25+.2*Math.sin(t/400+i);ctx.beginPath();ctx.arc(px,py,(s?21:15)+4*Math.sin(t/400+i),0,7);ctx.fill();
  ctx.globalAlpha=1;ctx.beginPath();ctx.arc(px,py,s?10:7,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke()});
}
function line(f,n,R,cx){ctx.beginPath();let pen=false;for(let i=0;i<n;i++){const [lo,la]=f(i),[x,y,c]=P(lo,la);if(c<0){pen=false;continue}const px=cx+x*R,py=cx-y*R;pen?ctx.lineTo(px,py):ctx.moveTo(px,py);pen=true}ctx.stroke()}
function loop(t){
 if(tgt){L0+=(tgt[0]-L0)*.05;F0+=(tgt[1]-F0)*.05;if(Math.abs(tgt[0]-L0)<.2&&Math.abs(tgt[1]-F0)<.2)tgt=null}
 else if(auto&&!drag)L0+=.04;
 draw(t);requestAnimationFrame(loop)}
function show(i){sel=i;const d=D[i];auto=false;tgt=[d[3],Math.max(-40,Math.min(50,d[2]*0.8))];
 document.getElementById('info').innerHTML='<button class="back" onclick="back()">← Todos los países</button>'+banner(i)+'<h2 style="margin-top:12px">'+d[0]+' <span class="yr">'+d[1]+'</span></h2><span class="tag">'+d[4]+'</span><p style="margin-top:10px">'+d[5]+'</p><p class="src" style="margin-top:8px">Fuente: '+d[6]+'</p>'+links(d[0]);
 document.getElementById('chips').style.display='none';if(innerWidth<=900)document.querySelector('.side').scrollIntoView({behavior:'smooth',block:'start'})}
function back(){sel=-1;tgt=null;auto=true;document.getElementById('chips').style.display='flex';
 document.getElementById('info').innerHTML='<h2>Elige un país</h2><p>Hay 22 países con puntos marcados. También puedes elegirlos en la lista de abajo.</p>'}

function banner(i){const d=D[i];if(d[7])return '<img class="ban" alt="Foto de la movilización" src="'+d[7]+'">';
 const h=(i*47)%360;let s='';
 for(let k=0;k<9;k++){const x=20+k*40,y=140+(k%3)*6;
  if(k%2===0)s+='<rect x="'+(x-1)+'" y="'+(y-66)+'" width="3" height="44" fill="rgba(0,0,0,.45)"/><rect x="'+(x-16)+'" y="'+(y-96)+'" width="32" height="26" rx="3" fill="rgba(255,255,255,.92)"/>';
  s+='<circle cx="'+x+'" cy="'+(y-30)+'" r="9" fill="rgba(0,0,0,.55)"/><rect x="'+(x-11)+'" y="'+(y-20)+'" width="22" height="50" rx="9" fill="rgba(0,0,0,.55)"/>'}
 return '<svg class="ban" viewBox="0 0 360 200" role="img" aria-label="Ilustración de una manifestación"><defs><linearGradient id="g'+i+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl('+h+',70%,58%)"/><stop offset="1" stop-color="hsl('+((h+40)%360)+',60%,28%)"/></linearGradient></defs><rect width="360" height="200" fill="url(#g'+i+')"/>'+s+'<text x="14" y="26" fill="#fff" font-size="15" font-weight="700" font-family="system-ui,sans-serif">'+d[0]+' · '+d[1]+'</text></svg>'}

D.forEach((d,i)=>{const b=document.createElement('button');b.textContent=d[0];b.onclick=()=>show(i);chips.appendChild(b)});
function pos(e){const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);const [x,y]=pos(e);drag={x,y,x0:x,y0:y,moved:false};tgt=null});
cv.addEventListener('pointermove',e=>{if(!drag)return;const [x,y]=pos(e);if(Math.hypot(x-drag.x0,y-drag.y0)>4)drag.moved=true;
 const k=45/(W*0.46);L0-=(x-drag.x)*k;F0=Math.max(-80,Math.min(80,F0+(y-drag.y)*k));drag.x=x;drag.y=y});
cv.addEventListener('pointerup',e=>{if(drag&&!drag.moved){const [x,y]=pos(e);let best=-1,bd=32;hits.forEach(h=>{const dd=Math.hypot(h[1]-x,h[2]-y);if(dd<bd){bd=dd;best=h[0]}});if(best>=0)show(best)}drag=null});
